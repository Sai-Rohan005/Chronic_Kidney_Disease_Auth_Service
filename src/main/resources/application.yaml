spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  application:
    name: CKD_AUTHSERVICE
server:
  port: 8081



mongodb:
  uri: ${MONGODB_URI:mongodb://localhost:27017/}
  database: ${MONGODB_DATABASE:CKD_JAVA}


app:
  jwt:
    secret: ${JWT_SECRET}

ckd-prediction:
  tabular-url: ${CKD_TABULAR_PREDICTION_URL:http://localhost:8001/routes/tab_predict}
  image-url: ${CKD_IMAGE_PREDICTION_URL:http://localhost:8001/routes/unet_predict}


ckd:
  security:
    auth-service: true
    login-limit: ${LOGIN_RATE_LIMIT:5}
    login-window-seconds: ${LOGIN_RATE_WINDOW_SECONDS:60}
